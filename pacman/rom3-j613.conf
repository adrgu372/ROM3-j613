# Install through ROM3-j613 installer, or append this file to /etc/pacman.conf.
#
# GitHub Releases is the initial static transport. Package and database
# signatures are mandatory. The mirrorlist can later move to another host
# without changing the [rom3-j613] repository name.

[rom3-j613]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/rom3-j613-mirrorlist


