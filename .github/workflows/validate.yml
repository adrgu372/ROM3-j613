name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate stack metadata
        run: python3 scripts/validate-stack.py
      - name: Validate shell scripts
        run: bash -n scripts/*.sh

