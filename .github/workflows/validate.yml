name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate stack metadata
        run: python3 scripts/validate-stack.py
      - name: Validate installer plan
        run: python3 scripts/validate-installer-plan.py
      - name: Validate Python tools
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m py_compile \
            packages/rom3-j613-guard/rom3-j613-check \
            packages/rom3-j613-guard/rom3-j613-override
          python3 scripts/test-override-tools.py
          test "$(sha256sum installer/keys/catalog-signing.ed25519.pub | cut -d' ' -f1)" = \
            2b7e847f34019f26eb9fc0dbd675611446357078f3057434be9491ba97c4404c
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Validate image patch
        run: scripts/check-image-patch.sh
      - name: Validate PKGBUILDs
        run: |
          for package in packages/*/PKGBUILD; do
            bash -n "$package"
          done
          ! rg -n -i '^pkg(name|base)=.*(aura|aurora)' packages/*/PKGBUILD

