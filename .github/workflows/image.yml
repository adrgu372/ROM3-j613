name: rom3-j613-image

on:
  workflow_dispatch:
    inputs:
      override_feed:
        description: Optional signed ROM3 override feed URL
        required: false
        type: string
      override_manifest_url:
        description: Optional override manifest URL
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out ROM3 metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: rom3
          persist-credentials: false

      - name: Check out pinned Aurora image builder
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aurora-silicon/alarm-aurora
          ref: 7c486c9125f88a463612f4450ee67c66d6db183c
          path: upstream
          persist-credentials: false

      - name: Apply ROM3 overlay patch
        run: |
          set -euo pipefail
          for patch_file in \
            "$GITHUB_WORKSPACE/rom3/patches/0001-build-image-add-rom3-overlay.patch" \
            "$GITHUB_WORKSPACE/rom3/patches/0002-build-image-signed-override-feed.patch"; do
            git -C "$GITHUB_WORKSPACE/upstream" apply --check "$patch_file"
            git -C "$GITHUB_WORKSPACE/upstream" apply "$patch_file"
          done

      - name: Build KDE image
        env:
          ROM3_FEED: https://github.com/adrgu372/ROM3-j613/releases/download/stable-20261127.3
          ROM3_OVERRIDE_FEED: ${{ inputs.override_feed }}
          ROM3_OVERRIDE_MANIFEST_URL: ${{ inputs.override_manifest_url }}
          ROM3_OVERRIDE_FINGERPRINT: FA80FF234BCDF36211649321EB9845C8BAA89A4A
          ROM3_KEY_URL: https://raw.githubusercontent.com/adrgu372/ROM3-j613/main/repo/keys/rom3-j613-packages.pub
          ROM3_FINGERPRINT: FA80FF234BCDF36211649321EB9845C8BAA89A4A
        run: |
          set -euo pipefail
          docker run --rm --privileged --ipc=host \
            -v /dev:/dev -v /run/udev:/run/udev:ro \
            -v "$GITHUB_WORKSPACE:/src" -w /src/upstream \
            -e ROM3_FEED -e ROM3_KEY_URL -e ROM3_FINGERPRINT \
            -e ROM3_OVERRIDE_FEED -e ROM3_OVERRIDE_MANIFEST_URL \
            -e ROM3_OVERRIDE_FINGERPRINT \
            registry.fedoraproject.org/fedora:44 \
            bash -euo pipefail -c '
              dnf install -y python3 gnupg2 tar gzip util-linux coreutils \
                btrfs-progs e2fsprogs dosfstools zstd systemd-udev bsdtar
              bash scripts/build-image arch-kde testing-20261122.1 testing
            ' 2>&1 | tee image-build.log

      - name: Attest image filesystem archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: upstream/out/*-filesystems.tar.zst

      - name: Upload candidate image
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: rom3-j613-arch-kde-candidate
          compression-level: 0
          path: |
            image-build.log
            upstream/out/*-filesystems.tar.zst*
            upstream/out/*-installer/image.json
          retention-days: 14

